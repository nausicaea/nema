[package]
name = "nema"
description = "Collect Modrinth mods based on a manifest and a lockfile"
version = "0.5.2"
authors = ["Eleanor Young <developer@nausicaea.net>"]
edition = "2024"

[dependencies]
anyhow = { version = "=1.0.104" }
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.6", features = ["derive", "env", "help", "std"] }
hex = { version = "=0.4.3", features = ["alloc"] }
reqwest = { version = "=0.13.4", features = ["json", "default-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = { version = "=0.11.0" }
tokio = { version = "=1.53.1", features = ["macros", "rt", "rt-multi-thread", "fs", "io-util"] }
tokio-stream = { version = "=0.1.19" }
tokio-util = { version = "=0.7.19", features = ["io"] }
toml = { version = "=1.1.4+spec-1.1.0", features = ["serde", "display", "parse"] }
tracing = { version = "=0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
rstest = "=0.26.1"
tempfile = "=3.27.0"

[profile.release]
panic = "abort"
